name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to diegotavaresoficial.com.br
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload files to server
        run: |
          scp -i ~/.ssh/id_rsa \
            index.html style.css \
            root@${{ secrets.DEPLOY_HOST }}:/data/coolify/applications/m40ow8ok0wkw4k480go04sk4/static/

      - name: Sync files into running container
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.DEPLOY_HOST }} '
            CONTAINER=$(docker ps --filter "name=app-m40ow8ok0wkw4k480go04sk4" --format "{{.Names}}" | head -1)
            if [ -n "$CONTAINER" ]; then
              docker cp /data/coolify/applications/m40ow8ok0wkw4k480go04sk4/static/index.html $CONTAINER:/app/dist/client/index.html
              docker cp /data/coolify/applications/m40ow8ok0wkw4k480go04sk4/static/style.css $CONTAINER:/app/dist/client/style.css
              echo "Sincronizado: $CONTAINER"
            else
              echo "Container nao encontrado - arquivos atualizados via bind mount"
            fi
          '
